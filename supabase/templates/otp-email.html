<!--
  Supabase Auth email template — six-digit sign-in code.
  Paste into BOTH templates in the Supabase Dashboard
  (Authentication → Emails → Templates):
    • "Magic Link"     — used when an existing user signs in with an email code
    • "Confirm signup" — used the first time a new user signs up with an email code
  Suggested subject line for both:  {{ .Token }} is your Sharwin TTA code
  The {{ .Token }} variable is required — without it the OTP flow cannot work.
-->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0B0C0F;padding:40px 16px;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="max-width:480px;width:100%;">
        <tr>
          <td style="padding-bottom:28px;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:999px;background-color:#E8590C;"></span>
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:20px;color:#F4F1EA;letter-spacing:0.08em;vertical-align:middle;">&nbsp;SHARWIN</span>
          </td>
        </tr>
        <tr>
          <td style="background-color:#14161B;border:1px solid #2A2D34;border-radius:12px;padding:36px 32px;">
            <p style="margin:0 0 8px;font-family:Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#9A9486;">Your sign-in code</p>
            <p style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.3;color:#F4F1EA;">Take your place at the table.</p>
            <p style="margin:0 0 24px;font-family:'Courier New',Courier,monospace;font-size:40px;font-weight:bold;letter-spacing:0.28em;color:#E8590C;">{{ .Token }}</p>
            <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;color:#9A9486;">
              Enter this code on the sign-in screen to continue. It expires in one hour.
              If you didn't request it, you can safely ignore this email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding-top:20px;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#6B6558;">
            Sharwin Table Tennis Academy, Bengaluru · sharwinttacademy@gmail.com
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
